name: SDET Journey CI
on: [push] # Run every time you push code

jobs:
  test_suite:
    runs-on: ubuntu-latest # The cloud computer OS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html webdriver-manager

      - name: Run Selenium Tests (Headless)
        run: |
          python -m pytest tests/ --browser_mode=headless --html=reports/cloud_report.html --self-contained-html